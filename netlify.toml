# ============ 构建配置 ============
[build]
  base = "REAbout"           # 直接进入前端目录
  command = "npm run build"  # 在 REAbout 目录下执行
  publish = "dist"           # 产物在 REAbout/dist

[build.environment]
  NODE_VERSION = "18"

# 如果后端也要部署
[functions]
  directory = "../REAbout-server/functions"

# ============ 路由配置 ============
# 所有 /api/* 请求转发到后端函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200