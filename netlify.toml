[build]
  base = "."
  command = "npm run setup && npm run build"
  publish = "REAbout/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "REAbout-server/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
